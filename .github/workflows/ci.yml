name: InfraGuard Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend-ci:
    name: Frontend Quality Control
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run ESLint Checks
        run: npm run lint

      - name: Run Format Verifications
        run: npm run format:check

      - name: Run TypeScript Strict Checks
        run: npm run typecheck

      - name: Compile Production Build
        run: npm run build --workspace frontend

  backend-ci:
    name: Backend Quality Control
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install flake8 black

      - name: Run Syntax Checks
        run: python -m compileall backend/app

      - name: Run Code Style Checks
        run: flake8 backend/app --max-line-length=88 --extend-ignore=E203

      - name: Run Format Verification
        run: black --check backend/app
